{% extends "katana/admin/base.html" %}
{% block title %}Admin Apps{% endblock %}
{% block body %}
<div class="portal layout" x-data="katanaApps()" x-init="load()">
    {% include "katana/admin/_nav.html" %}
    <div class="main">
        <header class="page-head">
            <h1>Apps</h1>
            <p>Histórico global de builds processados no servidor</p>
        </header>

        <section class="section">
            <div class="section-head">
                <h2>Histórico</h2>
                <p>Todos os builds registrados na plataforma</p>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Usuário</th><th>App</th><th>Status</th><th>Data</th><th>Download</th></tr></thead>
                    <tbody>
                        <template x-for="item in apps" :key="item.build_id + item.username + item.timestamp">
                            <tr>
                                <td x-text="item.username"></td>
                                <td x-text="item.app_name"></td>
                                <td>{% include "partials/alpine_status_badge.html" %}</td>
                                <td x-text="item.date_display"></td>
                                <td>{% set download_base = "/katana/admin/api/build/" %}{% include "partials/build_download_cell.html" %}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
{% endblock %}
