{% extends "subscriber/base.html" %}
{% block title %}Meus Apps{% endblock %}
{% block body %}
<div class="portal layout" x-data="subscriberApps()" x-init="load()">
    {% include "subscriber/_nav.html" %}
    <div class="main">
        <header class="page-head">
            <h1>Apps</h1>
            <p>Histórico completo dos seus uploads</p>
        </header>

        <section class="section">
            <div class="section-head">
                <h2>Histórico</h2>
                <p>Builds processados na sua conta</p>
            </div>
            <div class="table-wrap apps-table-wrap">
                <table class="apps-table">
                    <thead>
                        <tr>
                            <th class="col-app">App</th>
                            <th class="col-status">Status</th>
                            <th class="col-date">Data</th>
                            <th class="col-num">Downloads</th>
                            <th class="col-action">Baixar</th>
                            <th class="col-link">Link</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="!apps.length">
                            <tr>
                                <td colspan="6" class="apps-empty">Nenhum build encontrado.</td>
                            </tr>
                        </template>
                        <template x-for="item in paginatedApps" :key="item.build_id + item.status + item.timestamp">
                            <tr>
                                <td class="col-app">
                                    <span class="apps-name" x-text="item.app_name"></span>
                                </td>
                                <td class="col-status">{% include "partials/alpine_status_badge.html" %}</td>
                                <td class="col-date" x-text="item.date_display"></td>
                                <td class="col-num">
                                    <span x-show="item.public_url" x-text="item.download_count ?? 0"></span>
                                    <span class="table-muted" x-show="!item.public_url">—</span>
                                </td>
                                <td class="col-action">
                                    <div class="apps-action-cell">{% set download_base = "/subscriber/api/build/" %}{% include "partials/build_download_cell.html" %}</div>
                                </td>
                                <td class="col-link public-link-cell">
                                    <template x-if="item.public_url">
                                        <div class="public-link-actions">
                                            <button type="button" class="btn btn-ghost btn-row-download btn-apps-compact" @click="copyLink(item)" :title="copiedId === item.build_id ? 'Copiado' : 'Copiar link'">
                                                <svg class="btn-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                    <rect x="5" y="5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.4"/>
                                                    <path d="M4 11V4a1 1 0 0 1 1-1h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/>
                                                </svg>
                                                <span x-text="copiedId === item.build_id ? 'Copiado' : 'Copiar'"></span>
                                            </button>
                                            <button type="button" class="btn btn-ghost btn-row-download btn-icon-only" @click="regenerateToken(item)" :disabled="busyId === item.build_id" title="Regenerar link" aria-label="Regenerar link">
                                                <svg class="btn-icon" :class="{ 'is-spinning': busyId === item.build_id }" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                                                    <path d="M12.5 2.5v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/>
                                                    <path d="M3.5 13.5v-3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/>
                                                    <path d="M4.2 10.8A4.5 4.5 0 0 1 12 5.5L12.5 5.5M11.8 5.2A4.5 4.5 0 0 1 4 10.5L3.5 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </template>
                                    <span class="table-muted" x-show="!item.public_url">—</span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <footer class="apps-pagination" x-show="apps.length > pageSize" x-cloak>
                    <p class="apps-pagination__info">
                        <span x-text="pageFrom"></span>–<span x-text="pageTo"></span>
                        de <span x-text="apps.length"></span>
                    </p>
                    <div class="apps-pagination__controls">
                        <button type="button" class="btn btn-ghost btn-pagination" @click="prevPage()" :disabled="page <= 1">Anterior</button>
                        <span class="apps-pagination__page">
                            <span x-text="page"></span> / <span x-text="totalPages"></span>
                        </span>
                        <button type="button" class="btn btn-ghost btn-pagination" @click="nextPage()" :disabled="page >= totalPages">Próxima</button>
                    </div>
                </footer>
            </div>
        </section>
    </div>
</div>
{% endblock %}
