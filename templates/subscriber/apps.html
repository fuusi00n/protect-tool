{% extends "subscriber/base.html" %}
{% block title %}Meus Apps{% endblock %}
{% block body %}
<div class="portal layout" x-data="subscriberApps()" x-init="load()">
    {% include "subscriber/_nav.html" %}
    <div class="main">
        <header class="page-head">
            <h1>Apps</h1>
            <p>Histórico completo dos seus uploads</p>
        </header>

        <section class="section">
            <div class="section-head">
                <h2>Histórico</h2>
                <p>Builds processados na sua conta</p>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>App</th><th>Status</th><th>Data</th><th>Download</th></tr></thead>
                    <tbody>
                        <template x-for="item in apps" :key="item.build_id + item.status + item.timestamp">
                            <tr>
                                <td x-text="item.app_name"></td>
                                <td>{% include "partials/alpine_status_badge.html" %}</td>
                                <td x-text="item.date_display"></td>
                                <td>{% set download_base = "/subscriber/api/build/" %}{% include "partials/build_download_cell.html" %}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>
{% endblock %}
