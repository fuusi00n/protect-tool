<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}katana{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.png') }}?v=3" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon.png') }}?v=3" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='assets/favicon.png') }}?v=3">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}?v=37">
</head>
<body{% block body_attrs %}{% endblock %}>
    {% block body %}{% endblock %}
    {% block portal_scripts %}{% endblock %}
</body>
</html>
