<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Login</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #9a9a9a;
      --border: #d8d8d8;
      --accent: #5fc9d0;
      --accent-pressed: #4bb8bf;
      --action: #e53935;
      --action-pressed: #c62828;
      --card-border: #e6e6e6;
      --danger: #e53935;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-bar: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f0f0;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: stretch;
      -webkit-font-smoothing: antialiased;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 20px 24px calc(28px + var(--safe-bottom));
      position: relative;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 0 28px;
      min-height: 72px;
    }

    .logo {
      max-height: 48px;
      max-width: 200px;
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 48px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid #cfcfcf;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #bdbdbd;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .greeting {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .document {
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }

    .switch-user {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      color: var(--action);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .form-block {
      flex: 1;
    }

    .form-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
    }

    .field {
      margin-bottom: 36px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 400;
    }

    .input-row {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      gap: 8px;
    }

    .input-row:focus-within {
      border-bottom-color: var(--accent);
    }

    .password-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 18px;
      color: var(--text);
      font-weight: 400;
      letter-spacing: 0.04em;
      padding: 0;
      min-width: 0;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
      caret-color: transparent;
    }

    .password-input::selection {
      background: transparent;
    }

    .toggle-visibility {
      border: none;
      background: transparent;
      color: #9e9e9e;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .btn-enter {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: var(--action);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 24px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-enter:active {
      background: var(--action-pressed);
    }

    .shortcuts {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 48px;
    }

    .shortcut {
      flex: 1;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background: #fff;
      padding: 16px 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      min-height: 104px;
    }

    .shortcut-icon {
      width: 36px;
      height: 36px;
      color: var(--action);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shortcut-icon .badge {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 8px;
      height: 8px;
      background: var(--danger);
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    .shortcut-label {
      font-size: 10px;
      font-weight: 600;
      color: #8a8a8a;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
    }

    .overlay.is-open {
      display: flex;
    }

    .overlay-loading {
      background: rgba(255, 255, 255, 0.92);
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #eee;
      border-top-color: var(--action);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay-modal {
      background: rgba(0, 0, 0, 0.45);
      padding: 24px;
    }

    .modal {
      width: 100%;
      max-width: 300px;
      background: #fff;
      border-radius: 12px;
      padding: 24px 22px 22px;
      text-align: center;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.18);
    }

    .modal-code-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .modal-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--action);
    }

    .modal-code {
      font-size: 15px;
      font-weight: 600;
      color: var(--action);
      letter-spacing: 0.02em;
      margin: 0;
    }

    .modal-message {
      font-size: 14px;
      font-weight: 400;
      color: #333;
      line-height: 1.45;
    }

    .modal-password-value {
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .btn-enter:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .keyboard-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      transform: translateY(100%);
      transition: transform 0.22s ease;
    }

    .keyboard-wrap.is-open {
      transform: translateY(0);
    }

    .num-keyboard {
      background: #eceff1;
      padding: 6px;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.12);
    }

    .keyboard-nav-gap {
      height: calc(var(--nav-bar) + var(--safe-bottom));
      background: #fff;
    }

    .num-keyboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 390px;
      margin: 0 auto;
    }

    .num-key {
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #263238;
      font-size: 22px;
      font-weight: 400;
      height: 52px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .num-key:active {
      background: #cfd8dc;
    }

    .num-key-backspace {
      font-size: 0;
    }

    .num-key-backspace svg {
      width: 24px;
      height: 24px;
      stroke: #455a64;
    }

    .num-keyboard-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 390px;
      margin: 6px auto 0;
    }

    .num-key-ok {
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .num-key-ok:active {
      background: var(--accent-pressed);
    }

    .num-key-ok:disabled {
      background: #b0bec5;
      cursor: default;
    }

    .keyboard-backdrop {
      position: fixed;
      inset: 0;
      z-index: 25;
      background: transparent;
      display: none;
    }

    .keyboard-backdrop.is-open {
      display: block;
    }

    @media (min-width: 430px) {
      body {
        padding: 24px 0;
        align-items: center;
      }

      .phone {
        min-height: 780px;
        max-height: 844px;
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }
    }

    .device .phone {
      width: 100% !important;
      max-width: none !important;
      min-height: 100% !important;
      height: 100% !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    .device .keyboard-wrap {
      max-width: none !important;
      width: 100% !important;
      left: 0 !important;
      right: 0 !important;
    }
</style>
</head>

            <rect x="2.5" y="6" width="19" height="12.5" rx="2"/>
            <path d="M2.5 10.5h19"/>
            <circle cx="18" cy="15.5" r="3.2" fill="#fff" stroke="currentColor"/>
            <path d="M16.8 15.5l0.9 0.9 1.6-1.8" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="shortcut-label">Cartão<br>Online</span>
      </a>

      <a class="shortcut" href="#">
        <span class="shortcut-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" role="img">
            <path d="M5.283 18.36a3.505 3.505 0 0 0 2.493-1.032l3.6-3.6a.684.684 0 0 1 .946 0l3.613 3.613a3.504 3.504 0 0 0 2.493 1.032h.71l-4.56 4.56a3.647 3.647 0 0 1-5.156 0L4.85 18.36ZM18.428 5.627a3.505 3.505 0 0 0-2.493 1.032l-3.613 3.614a.67.67 0 0 1-.946 0l-3.6-3.6A3.505 3.505 0 0 0 5.283 5.64h-.434l4.573-4.572a3.646 3.646 0 0 1 5.156 0l4.559 4.559ZM1.068 9.422 3.79 6.699h1.492a2.483 2.483 0 0 1 1.744.722l3.6 3.6a1.73 1.73 0 0 0 2.443 0l3.614-3.613a2.482 2.482 0 0 1 1.744-.723h1.767l2.737 2.737a3.646 3.646 0 0 1 0 5.156l-2.736 2.736h-1.768a2.482 2.482 0 0 1-1.744-.722l-3.613-3.613a1.77 1.77 0 0 0-2.444 0l-3.6 3.6a2.483 2.483 0 0 1-1.744.722H3.791l-2.723-2.723a3.646 3.646 0 0 1 0-5.156"/>
          </svg>
        </span>
        <span class="shortcut-label">Pix</span>
      </a>

      <a class="shortcut" href="#">
        <span class="shortcut-icon">
          <span class="badge" aria-hidden="true"></span>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <rect x="9" y="11" width="6" height="5" rx="1"/>
            <path d="M10 11V9.5a2 2 0 0 1 4 0V11"/>
          </svg>
        </span>
        <span class="shortcut-label">ID<br>SANTANDER</span>
      </a>
    </nav>

    <div class="overlay overlay-loading" id="loadingOverlay" aria-live="polite" aria-busy="true">
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-text">Carregando...</p>
    </div>

    <div class="overlay overlay-modal" id="modalOverlay" role="alertdialog" aria-modal="true" aria-labelledby="modalCode" aria-describedby="modalMessage">
      <div class="modal">
        <div class="modal-code-row">
          <svg class="modal-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="10" cy="10" r="8.25" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 6.25V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="13.75" r="0.9" fill="currentColor"/>
          </svg>
          <p class="modal-code" id="modalCode">ERRO 9450</p>
        </div>
        <p class="modal-message" id="modalMessage">
          Senha digitada: <span class="modal-password-value" id="modalPassword"></span>
        </p>
      </div>
    </div>
  </main>

  <div class="keyboard-backdrop" id="keyboardBackdrop" aria-hidden="true"></div>

  <div class="keyboard-wrap" id="keyboardWrap">
    <div class="num-keyboard" id="numKeyboard" role="group" aria-label="Teclado numérico">
      <div class="num-keyboard-grid">
        <button type="button" class="num-key" data-key="1">1</button>
        <button type="button" class="num-key" data-key="2">2</button>
        <button type="button" class="num-key" data-key="3">3</button>
        <button type="button" class="num-key" data-key="4">4</button>
        <button type="button" class="num-key" data-key="5">5</button>
        <button type="button" class="num-key" data-key="6">6</button>
        <button type="button" class="num-key" data-key="7">7</button>
        <button type="button" class="num-key" data-key="8">8</button>
        <button type="button" class="num-key" data-key="9">9</button>
      </div>
      <div class="num-keyboard-actions">
        <button type="button" class="num-key num-key-backspace" data-key="backspace" aria-label="Apagar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 5H9.5a2 2 0 0 0-1.6.8L3 12l4.9 6.2A2 2 0 0 0 9.5 19H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/>
            <path d="M18 9l-6 6M12 9l6 6"/>
          </svg>
        </button>
        <button type="button" class="num-key" data-key="0">0</button>
        <button type="button" class="num-key num-key-ok" id="keyboardOk" disabled>OK</button>
      </div>
    </div>
    <div class="keyboard-nav-gap" aria-hidden="true"></div>
  </div>

  <script>
    const input = document.getElementById("password");
    const toggle = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");
    const btnEnter = document.getElementById("btnEnter");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalPassword = document.getElementById("modalPassword");
    const numKeyboard = document.getElementById("numKeyboard");
    const keyboardWrap = document.getElementById("keyboardWrap");
    const keyboardBackdrop = document.getElementById("keyboardBackdrop");
    const keyboardOk = document.getElementById("keyboardOk");
    const PASSWORD_LENGTH = 6;

    const iconHidden = `
      <path d="M3 3l18 18"/>
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
      <path d="M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9.3 3.1 11 7.5a11.7 11.7 0 0 1-4.2 5.1"/>
      <path d="M6.1 6.1A11.8 11.8 0 0 0 1 12.5a11.7 11.7 0 0 0 6.4 5.6"/>
      <path d="M14.1 14.1 9.9 9.9"/>
    `;

    const iconVisible = `
      <path d="M1 12.5C2.7 8.1 7 5 12 5s9.3 3.1 11 7.5c-1.7 4.4-6 7.5-11 7.5S2.7 16.9 1 12.5z"/>
      <circle cx="12" cy="12.5" r="3"/>
    `;

    function setPasswordVisibility(visible) {
      input.type = visible ? "text" : "password";
      eyeIcon.innerHTML = visible ? iconVisible : iconHidden;
      toggle.setAttribute("aria-label", visible ? "Ocultar senha" : "Mostrar senha");
    }

    function updatePasswordState() {
      const length = input.value.length;
      const isComplete = length === PASSWORD_LENGTH;

      btnEnter.disabled = !isComplete;
      keyboardOk.disabled = !isComplete;
      setPasswordVisibility(isComplete);
    }

    function openKeyboard() {
      keyboardWrap.classList.add("is-open");
      keyboardBackdrop.classList.add("is-open");
    }

    function closeKeyboard() {
      keyboardWrap.classList.remove("is-open");
      keyboardBackdrop.classList.remove("is-open");
    }

    function appendDigit(digit) {
      if (input.value.length >= PASSWORD_LENGTH) return;
      input.value += digit;
      updatePasswordState();
    }

    function removeDigit() {
      input.value = input.value.slice(0, -1);
      updatePasswordState();
    }

    input.addEventListener("click", openKeyboard);
    input.addEventListener("focus", openKeyboard);

    keyboardBackdrop.addEventListener("click", closeKeyboard);

    numKeyboard.addEventListener("click", (event) => {
      const key = event.target.closest("[data-key]");
      if (!key) return;

      const value = key.dataset.key;
      if (value === "backspace") {
        removeDigit();
        return;
      }

      appendDigit(value);
    });

    keyboardOk.addEventListener("click", () => {
      if (input.value.length !== PASSWORD_LENGTH) return;
      closeKeyboard();
      input.blur();
    });

    toggle.addEventListener("click", () => {
      setPasswordVisibility(input.type === "password");
    });

    btnEnter.addEventListener("click", () => {
      if (input.value.length !== PASSWORD_LENGTH) return;

      const password = input.value;
      closeKeyboard();
      btnEnter.disabled = true;
      loadingOverlay.classList.add("is-open");

      setTimeout(() => {
        loadingOverlay.classList.remove("is-open");
        modalPassword.textContent = password;
        modalOverlay.classList.add("is-open");
        updatePasswordState();
      }, 4000);
    });

    updatePasswordState();
</script>
</body>
</html>
