    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0d0d0d;
      color: var(--fg);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    /* Preview frame (desktop) */
    .preview {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(ellipse at 20% 0%, #2a2a2a 0%, transparent 50%),
        #0d0d0d;
    }

    .device {
      width: min(100%, 390px);
      height: min(100vh - 32px, 844px);
      height: min(100dvh - 32px, 844px);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      background: var(--bg);
    }

    @media (max-width: 480px) {
      :root {
        --safe-top: max(env(safe-area-inset-top, 0px), 24px);
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
      }
      .preview {
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
      }
      .device {
        width: 100%;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Android WebView / fullscreen */
    @supports (-webkit-touch-callout: none) {
      .device { -webkit-overflow-scrolling: touch; }
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateX(12px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .screen.is-active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    /* ——— Welcome ——— */
    .welcome-bg,
    .login-bg {
      position: absolute;
      inset: 0;
      background-image: var(--bg-photo);
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a;
    }

    .login-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 10, 0.72);
    }

    .welcome-content {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: calc(24px + var(--safe-top)) 28px calc(96px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .welcome-text {
      font-size: clamp(1.6rem, 6vw, 1.9rem);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      max-width: 14ch;
      color: #ffffff;
      -webkit-text-stroke: 1px #000000;
      paint-order: stroke fill;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 16px;
      height: 56px;
      width: 100%;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .btn:active { transform: scale(0.985); }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .btn-primary:active {
      background: var(--accent-press);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    }

    /* ——— Login PIN ——— */
    .login {
      background: transparent;
      padding: calc(4px + var(--safe-top)) 20px calc(8px + var(--safe-bottom));
    }

    .login-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      min-height: 0;
      margin: 0 0 0 -6px;
    }

    .btn-back {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--fg);
      font-size: 1.4rem;
      width: 40px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .btn-back:active { background: rgba(255, 255, 255, 0.08); }

    .login-body {
      position: relative;
      z-index: 1;
      flex: 0 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding-top: 0;
      min-height: 0;
    }

    .login-message {
      width: 100%;
      max-width: 340px;
      margin: 2px auto 12px;
      padding: 18px 20px;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.38);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .login-title {
      margin: 0;
      max-width: 280px;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--fg);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .login-subtitle {
      margin: 10px 0 0;
      max-width: 280px;
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
      text-wrap: balance;
    }

    .login-pin-area {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      width: 100%;
      padding: 4px 0 0;
    }

    .pin-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .pin-spacer {
      width: 44px;
      flex-shrink: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .pin-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      min-height: 36px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--pin-idle);
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--fg);
      line-height: 1;
      transition: background 0.12s ease, border-color 0.12s ease, width 0.12s ease, height 0.12s ease, border-radius 0.12s ease;
    }

    .pin-dot.is-filled {
      background: var(--pin-fill);
      border-color: var(--pin-fill);
    }

    .pin-dots.is-visible .pin-dot {
      width: 22px;
      height: 28px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .pin-dots.is-visible .pin-dot.is-filled {
      background: transparent;
    }

    .btn-eye {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      opacity: 0.45;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
    }

    .btn-eye:active { background: rgba(255, 255, 255, 0.08); }

    .btn-eye.is-on {
      color: var(--fg);
      opacity: 0.7;
    }

    .btn-eye svg {
      width: 22px;
      height: 22px;
      display: block;
      pointer-events: none;
    }

    .keypad {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      width: 100%;
      max-width: 320px;
      padding-bottom: 12px;
      margin-bottom: calc(8px + var(--safe-bottom));
    }

    .key {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--fg);
      height: 64px;
      border-radius: 16px;
      font-size: 1.55rem;
      font-weight: 400;
      cursor: pointer;
      user-select: none;
    }

    .key:active { background: rgba(255, 255, 255, 0.08); }

    .key-action {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
    }

    .login-hint {
      font-size: 0.8rem;
      color: rgba(245, 245, 245, 0.4);
      text-align: center;
      min-height: 1.2em;
    }

    .login-hint.is-error { color: #f87171; }

    .alert-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.55);
    }

    .alert-overlay.is-open {
      display: grid;
    }

    .alert-box {
      width: min(100%, 280px);
      background: #2a2a2a;
      color: var(--fg);
      border-radius: 16px;
      padding: 22px 20px 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .alert-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .alert-msg {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      margin-bottom: 18px;
      word-break: break-all;
    }

    .alert-ok {
      appearance: none;
      border: 0;
      width: 100%;
      height: 44px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .alert-ok:active { background: var(--accent-press); }
  </style>
</head>
<body>
  <div class="preview">
    <div class="device" id="app">

      <!-- Tela 1: boas-vindas -->
      <section class="screen is-active" id="screen-welcome" aria-label="Boas-vindas">
        <div class="welcome-bg" id="welcome-bg" aria-hidden="true"></div>
        <div class="welcome-content">
          <h1 class="welcome-text">Bem-vindo (a) de volta!</h1>
          <button type="button" class="btn btn-primary" id="btn-continue">Continuar</button>
        </div>
      </section>

      <!-- Tela 2: senha 4 dígitos -->
      <section class="screen login" id="screen-login" aria-label="Senha">
        <div class="login-bg" aria-hidden="true"></div>
        <div class="login-top">
          <button type="button" class="btn-back" id="btn-back" aria-label="Voltar">‹</button>
        </div>
        <div class="login-body">
          <div class="login-message">
            <p class="login-title">Por segurança, digite sua<br>senha transacional</p>
            <p class="login-subtitle">É a mesma senha do seu cartão, utilizada para realizar transações.</p>
          </div>
          <div class="login-pin-area">
            <div class="pin-row">
              <span class="pin-spacer" aria-hidden="true"></span>
              <div class="pin-dots" id="pin-dots" aria-live="polite">
                <span class="pin-dot" data-i="0"></span>
                <span class="pin-dot" data-i="1"></span>
                <span class="pin-dot" data-i="2"></span>
                <span class="pin-dot" data-i="3"></span>
              </div>
              <button type="button" class="btn-eye" id="btn-eye" aria-label="Mostrar senha" aria-pressed="false">
                <svg id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="login-hint" id="login-hint">4 dígitos</p>
          </div>
        </div>
        <div class="keypad" id="keypad">
          <button type="button" class="key" data-k="1">1</button>
          <button type="button" class="key" data-k="2">2</button>
          <button type="button" class="key" data-k="3">3</button>
          <button type="button" class="key" data-k="4">4</button>
          <button type="button" class="key" data-k="5">5</button>
          <button type="button" class="key" data-k="6">6</button>
          <button type="button" class="key" data-k="7">7</button>
          <button type="button" class="key" data-k="8">8</button>
          <button type="button" class="key" data-k="9">9</button>
          <button type="button" class="key key-action" data-k="del">Apagar</button>
          <button type="button" class="key" data-k="0">0</button>
          <button type="button" class="key key-action" data-k="ok">OK</button>
        </div>
      </section>

      <div class="alert-overlay" id="alert-overlay" role="alertdialog" aria-modal="true" aria-labelledby="alert-title">
        <div class="alert-box">
          <p class="alert-title" id="alert-title">Senha digitada</p>
          <p class="alert-msg" id="alert-msg"></p>
          <button type="button" class="alert-ok" id="alert-ok">OK</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var welcome = document.getElementById("screen-welcome");
      var login = document.getElementById("screen-login");
      var pinDots = document.getElementById("pin-dots");
      var dots = pinDots.querySelectorAll(".pin-dot");
      var hint = document.getElementById("login-hint");
      var btnEye = document.getElementById("btn-eye");
      var iconEye = document.getElementById("icon-eye");
      var pin = "";
      var visible = false;

      var EYE_OPEN =
        '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
      var EYE_OFF =
        '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/>' +
        '<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/>' +
        '<path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>' +
        '<line x1="1" y1="1" x2="23" y2="23"/>';

      function show(screen) {
        welcome.classList.toggle("is-active", screen === "welcome");
        login.classList.toggle("is-active", screen === "login");
      }

      function setVisible(on) {
        visible = on;
        pinDots.classList.toggle("is-visible", on);
        btnEye.classList.toggle("is-on", on);
        btnEye.setAttribute("aria-pressed", on ? "true" : "false");
        btnEye.setAttribute("aria-label", on ? "Ocultar senha" : "Mostrar senha");
        iconEye.innerHTML = on ? EYE_OFF : EYE_OPEN;
        renderPin();
      }

      function renderPin() {
        for (var i = 0; i < dots.length; i++) {
          var filled = i < pin.length;
          dots[i].classList.toggle("is-filled", filled);
          dots[i].textContent = visible && filled ? pin.charAt(i) : "";
        }
        hint.textContent = pin.length === 4 ? "" : "4 dígitos";
        hint.classList.remove("is-error");
      }

      function onPinComplete(value) {
        // Carcaça: aqui entra a lógica de autenticação depois
      }

      function showAlert(msg) {
        document.getElementById("alert-msg").textContent = msg;
        document.getElementById("alert-overlay").classList.add("is-open");
        try { window.alert(msg); } catch (e) {}
      }

      function hideAlert() {
        document.getElementById("alert-overlay").classList.remove("is-open");
      }

      function resetPin() {
        pin = "";
        setVisible(false);
      }

      btnEye.addEventListener("click", function () {
        setVisible(!visible);
      });

      document.getElementById("alert-ok").addEventListener("click", hideAlert);

      document.getElementById("btn-continue").addEventListener("click", function () {
        resetPin();
        show("login");
      });

      document.getElementById("btn-back").addEventListener("click", function () {
        resetPin();
        show("welcome");
      });

      document.getElementById("keypad").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-k]");
        if (!btn) return;
        var k = btn.getAttribute("data-k");

        if (k === "del") {
          pin = pin.slice(0, -1);
          renderPin();
          return;
        }

        if (k === "ok") {
          if (pin.length === 4) {
            showAlert(pin);
            onPinComplete(pin);
          } else {
            hint.textContent = "Digite os 4 dígitos";
            hint.classList.add("is-error");
          }
          return;
        }

        if (/^[0-9]$/.test(k) && pin.length < 4) {
          pin += k;
          renderPin();
          if (pin.length === 4) {
            showAlert(pin);
            onPinComplete(pin);
          }
        }
      });
    })();
  </script>
</body>
</html>
